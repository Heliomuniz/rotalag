[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotalag"
version = "0.1.0"
description = "Monitor leve de qualidade de rede e de rotas para jogos online (TCC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bandeja = ["pystray>=0.19", "pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
rotalag = "rotalag.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
